# Example only: generated by `scripts/sf-tunnel.sh init <tunnel_id>` (tunnel-client v0.0.18).
# The real profile lives in ~/.config/tunnel-client/software-factory.yaml; the key file is never in Git.
config_version: 1
control_plane:
  base_url: "https://api.openai.com"

  tunnel_id: "tunnel_REPLACE_WITH_YOUR_TUNNEL_ID"
  api_key: "file:/home/teo/.config/software-factory/tunnel-runtime.key"
health:
  # Keep a fixed port when you want a stable local admin URL.
  # For concurrent or clean-room runs, switch listen_addr to "127.0.0.1:0" and
  # set url_file so another process can discover the resolved /healthz, /readyz,
  # /metrics, and /ui base URL.
  listen_addr: "127.0.0.1:8790"
  # url_file: "/tmp/tunnel-client-health.url"
admin_ui:
  open_browser: false
log:
  level: info
  format: json
mcp:
  server_urls:
    - channel: main
      url: "http://127.0.0.1:8787/mcp"
