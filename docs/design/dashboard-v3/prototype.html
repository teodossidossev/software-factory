<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Factory Job Stream</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the board keeps its five columns; a job opens as a full page: sticky head, one stream, composer pinned at the bottom.
   Tokens follow the live dashboard's app.css so the prototype reads as the same tool. */
:root {
  --bg: #f4f5f7; --panel: #ffffff; --panel-2: #f7f8fa; --fg: #1f2328; --muted: #636c76;
  --border: #d8dde3; --border-strong: #c3cad2; --accent: #2b6cb0; --accent-fg: #ffffff; --selected: #e8f0fb;
  --add: #1a7f37; --add-bg: #e6f4ea; --del: #b42318; --del-bg: #fdecea; --warn: #9a6700; --warn-bg: #fff4d6; --hunk: #6f42c1;
  --s-working: #2b6cb0; --s-review: #b7791f; --s-human: #c05621; --s-ready: #2f855a; --s-ended: #718096; --s-failed: #c53030;
  --a-impl: #2b6cb0; --a-claude: #b7791f; --a-codex: #6f42c1; --a-you: #2f855a; --a-factory: #718096;
  --proto: #b42318; --proto-bg: #fdecea; --bar: #1f2328; --bar-fg: #f4f5f7;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 8px; --radius-sm: 6px; --control: 32px; --shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
  --tree-w: 320px; --vcs-mod: #2f6ad0; --vcs-add: #3d8a33; --vcs-del: #8c8c8c; --wbg-add: #b7e4c0; --wbg-del: #f5c1bd;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141619; --panel: #1d2024; --panel-2: #23272c; --fg: #e6e8eb; --muted: #9aa3ad; --border: #343a41; --border-strong: #454c55;
  --accent: #6fa8ff; --accent-fg: #0b1220; --selected: #26354a; --add: #56d364; --add-bg: #1b3524; --del: #ff7b72; --del-bg: #3d1f1f;
  --warn: #e3b341; --warn-bg: #3b2f12; --hunk: #b392f0; --s-working: #6fa8ff; --s-review: #e3b341; --s-human: #f0883e; --s-ready: #56d364;
  --s-ended: #9aa3ad; --s-failed: #ff7b72; --a-impl: #6fa8ff; --a-claude: #e3b341; --a-codex: #b392f0; --a-you: #56d364; --a-factory: #9aa3ad;
  --proto: #ff7b72; --proto-bg: #3d1f1f; --bar: #e6e8eb; --bar-fg: #141619; --shadow: none; --vcs-mod: #6c9ef8; --vcs-add: #73bd79; --vcs-del: #8f9399; --wbg-add: #2c5d36; --wbg-del: #6b2b2b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141619; --panel: #1d2024; --panel-2: #23272c; --fg: #e6e8eb; --muted: #9aa3ad; --border: #343a41; --border-strong: #454c55;
  --accent: #6fa8ff; --accent-fg: #0b1220; --selected: #26354a; --add: #56d364; --add-bg: #1b3524; --del: #ff7b72; --del-bg: #3d1f1f;
  --warn: #e3b341; --warn-bg: #3b2f12; --hunk: #b392f0; --s-working: #6fa8ff; --s-review: #e3b341; --s-human: #f0883e; --s-ready: #56d364;
  --s-ended: #9aa3ad; --s-failed: #ff7b72; --a-impl: #6fa8ff; --a-claude: #e3b341; --a-codex: #b392f0; --a-you: #56d364; --a-factory: #9aa3ad;
  --proto: #ff7b72; --proto-bg: #3d1f1f; --bar: #e6e8eb; --bar-fg: #141619; --shadow: none; --vcs-mod: #6c9ef8; --vcs-add: #73bd79; --vcs-del: #8f9399; --wbg-add: #2c5d36; --wbg-del: #6b2b2b; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button { font: inherit; color: inherit; }
code, pre, .mono { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.btn { height: var(--control); padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--panel); cursor: pointer; white-space: nowrap; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--del); }
.btn.small { height: 26px; padding: 0 8px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.kbd { font: 11px var(--mono); border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); }
.tag { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.proto-badge { font: 700 10px/1 var(--sans); letter-spacing: .08em; color: var(--proto); background: var(--proto-bg); border: 1px solid var(--proto); border-radius: 4px; padding: 3px 6px; }
.muted { color: var(--muted); }

/* Board */
#board { padding-block: 0 72px; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar h1 { font-size: 16px; margin: 0; display: flex; gap: 8px; align-items: center; }
.topbar .summary { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.topbar .ws { margin-left: auto; font-size: 12px; }
.cols { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-x: auto; align-items: start; }
.col { min-width: 0; }
.col h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; display: flex; gap: 6px; align-items: baseline; }
.col h2 .n { font-variant-numeric: tabular-nums; }
.col.you h2 { color: var(--s-human); }
.col ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.col .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 4px; box-shadow: var(--shadow); cursor: pointer; }
.card:hover, .card:focus-visible { border-color: var(--accent); }
.card.static { cursor: default; }
.card.static:hover { border-color: var(--border); }
.card .row1 { display: flex; gap: 8px; align-items: baseline; font-size: 12px; }
.card .key { font: 600 12px var(--mono); }
.card .money { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.card .title { font-weight: 600; line-height: 1.35; text-wrap: balance; }
.card .now { font-size: 12px; display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.card .now b { color: var(--a-impl); white-space: nowrap; }
.card .now span { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.card .reason { font-size: 13px; font-weight: 600; color: var(--s-human); display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
.card .reason.ready { color: var(--s-ready); }
.card .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .act { margin-top: 4px; display: flex; gap: 8px; }
.card .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--s-working); display: inline-block; animation: pulse 1.6s infinite; flex: none; align-self: center; }
@keyframes pulse { 50% { opacity: .3; } }
@media (max-width: 760px) {
  .cols { grid-template-columns: minmax(0, 1fr); overflow-x: visible; }
  .col.you { order: -2; } .col.impl, .col.rev { order: -1; }
}

/* Job view: a full page */
#job { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); z-index: 6;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px)); }
.jhead { background: var(--panel); border-bottom: 1px solid var(--border); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; }
.jhead .back { grid-row: span 2; }
.jhead .t1 { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.jhead .t1 .key { font: 600 13px var(--mono); }
.jhead .t1 .title { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jhead .t2 { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); align-items: center; font-variant-numeric: tabular-nums; }
.jhead .sentence { color: var(--fg); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--s-ended); }
.st-working .dot, .st-starting .dot { background: var(--s-working); animation: pulse 1.6s infinite; }
.st-awaiting_review .dot, .st-preparing_mr .dot { background: var(--s-review); }
.st-needs_human .dot { background: var(--s-human); }
.st-ready_for_human_review .dot, .st-pushed .dot { background: var(--s-ready); }
.jhead .tools { grid-row: span 2; display: flex; gap: 8px; align-items: center; }
.scr { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.streamwrap { flex: 1; overflow-y: auto; min-height: 0; padding-block: 8px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (max-width: 760px) { .jhead { grid-template-columns: minmax(0, 1fr) auto; } .jhead .back { grid-row: auto; } .jhead .t1 { grid-column: 1 / -1; order: 3; } .jhead .t2 { grid-column: 1 / -1; order: 4; } .jhead .tools { grid-row: auto; grid-column: 1 / -1; order: 5; } }

/* Stream */
#stream { list-style: none; margin: 0 auto; padding: 0; max-width: 1180px; font-size: 13px; }
.sep { position: sticky; top: -8px; z-index: 2; background: var(--bg); display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 6px 0; font-weight: 600; font-size: 13px; }
.sep::after { content: ""; flex: 1; border-top: 1px solid var(--border-strong); }
.sep .tag { font-weight: 400; }
.e { display: grid; grid-template-columns: 44px 104px minmax(0, 1fr); gap: 0 10px; padding: 1px 6px; border-radius: 4px; border-left: 2px solid transparent; }
.e.sel { background: var(--selected); border-left-color: var(--accent); }
.e > .ts { color: var(--muted); font: 11px/20px var(--mono); font-variant-numeric: tabular-nums; }
.e > .who { font-size: 12px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.e > .who.cont { visibility: hidden; }
.who-implementer > .who { color: var(--a-impl); } .who-claude > .who { color: var(--a-claude); } .who-codex > .who { color: var(--a-codex); }
.who-you > .who { color: var(--a-you); } .who-factory > .who, .who-mr > .who, .who-proto > .who { color: var(--a-factory); }
.e > .body { min-width: 0; line-height: 20px; }
.e-tool .line { all: unset; cursor: pointer; display: block; font: 12.5px/20px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
.e-tool .line::before { content: "▸ "; color: var(--muted); }
.e-tool.open .line::before { content: "▾ "; }
.e-tool .line .verb { font-weight: 600; }
.e-tool .line .out { color: var(--muted); }
.e-tool .line .out.bad { color: var(--del); }
.e-tool.err .line { color: var(--del); }
.who-codex.e-tool .line, .who-claude.e-tool .line { opacity: .9; }
.more { margin: 4px 0 8px; display: grid; gap: 6px; }
.more pre, pre.raw { margin: 0; background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 12px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
.more .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.e-text .prose { white-space: pre-wrap; word-break: break-word; padding: 2px 0; }
.e-text.clamp .prose { max-height: 160px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.prose code { background: var(--panel-2); border: 1px solid var(--border); border-radius: 3px; padding: 0 3px; font-size: 12px; }
.prose .h { font-weight: 700; }
.linkish { all: unset; cursor: pointer; color: var(--accent); font-size: 12px; }
.linkish:hover { text-decoration: underline; }
.e-result .body, .e-note .body { color: var(--muted); font-size: 12px; }
.e-state .body { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; }
.e-state .body b { color: var(--fg); font-weight: 600; }
.block { border: 1px solid var(--border); background: var(--panel); border-radius: var(--radius); padding: 10px 12px; margin: 6px 0; display: grid; gap: 6px; }
.block .bh { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; font-weight: 600; }
.verdict { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .05em; border-radius: 4px; padding: 1px 6px; }
.verdict.clean { color: var(--add); background: var(--add-bg); }
.verdict.fix { color: var(--warn); background: var(--warn-bg); }
.verdict.stop { color: var(--del); background: var(--del-bg); }
.block .summary { white-space: pre-wrap; font-size: 13px; }
.block.clamp .summary { max-height: 84px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
.findings { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.finding { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 2px 8px; align-items: baseline; border-top: 1px solid var(--border); padding-top: 6px; }
.finding .fid { font: 700 12px var(--mono); }
.finding .path { font: 12px var(--mono); color: var(--accent); cursor: pointer; overflow-wrap: anywhere; }
.finding .problem, .finding .expected, .finding .decide { grid-column: 2 / -1; }
.finding .problem { font-size: 13px; }
.finding .expected { font-size: 12px; color: var(--muted); }
.finding .decide { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
.finding .decided { font-size: 12px; font-weight: 600; }
.sev { font: 600 11px var(--sans); border-radius: 999px; padding: 0 7px; white-space: nowrap; }
.sev-blocker { color: var(--del); background: var(--del-bg); }
.sev-major { color: var(--warn); background: var(--warn-bg); }
.sev-minor, .sev-nit, .sev-note { color: var(--muted); background: var(--panel-2); border: 1px solid var(--border); }
.block.stop { border-color: var(--s-human); border-width: 2px; }
.block.fixsec { border-style: dashed; }
.block.you { border-color: var(--a-you); }
.block.sim { border-style: dashed; border-color: var(--proto); }
.simtag { font: 600 10px var(--sans); color: var(--proto); letter-spacing: .06em; text-transform: uppercase; }
.inline-diff { margin-top: 6px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
.inline-diff .dhead { top: 22px; }
.inline-diff .diff { border: 0; }
.inline-diff .dl { white-space: pre-wrap; min-width: 0; word-break: break-all; }

/* Diffs: no diff box scrolls on its own; its pane does */
.diff { font: 12px/1.45 var(--mono); background: var(--panel); }
.diff .dl { white-space: pre; padding: 0 10px; min-width: max-content; }
.diff .add { background: var(--add-bg); color: var(--add); }
.diff .del { background: var(--del-bg); color: var(--del); }
.diff .hunk { color: var(--hunk); background: var(--panel-2); }
.diff .meta { color: var(--muted); padding-block: 4px; }
.diff .cutline { color: var(--proto); padding: 4px 10px; font-style: italic; }
.dhead { position: sticky; top: 0; left: 0; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--border); font-size: 13px; }
.dhead .dpath { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.dhead .dpath b { font-family: var(--mono); font-size: 12.5px; }
.dhead .dpath .muted { font-family: var(--mono); font-size: 12px; }
.dhead .sp { flex: 1; }
.dhead .pos { font-size: 12px; font-variant-numeric: tabular-nums; }
.n .a, .dhead .a { color: var(--add); } .n .r, .dhead .r { color: var(--del); }

/* File rows: one line each, name bold, folder muted and middle-truncated, counts right */
.files { list-style: none; margin: 0; padding: 0; }
.frow { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 3px 12px; font: 12px/1.6 var(--mono); white-space: nowrap; }
.frow:hover { background: var(--panel-2); }
.frow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.frow.on { background: var(--selected); box-shadow: inset 2px 0 var(--accent); }
.frow .stl { width: 1.2em; flex: none; font-weight: 700; color: var(--muted); text-align: center; }
.frow .st-added { color: var(--add); } .frow .st-deleted { color: var(--del); }
.frow .fname { font-weight: 700; flex: 0 1 auto; min-width: 0; max-width: 60%; overflow: hidden; text-overflow: ellipsis; }
.frow .fdir { color: var(--muted); flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.frow .n { flex: none; margin-left: auto; font-variant-numeric: tabular-nums; text-align: right; min-width: 7ch; }
.fb { font: 600 10px var(--sans); border-radius: 999px; padding: 0 6px; flex: none; }
.fb.warn { color: var(--warn); background: var(--warn-bg); }
.files/* Screen switch in the job header */
.switch { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; }
.switch button { all: unset; cursor: pointer; padding: 0 12px; height: 30px; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; border-right: 1px solid var(--border-strong); white-space: nowrap; }
.switch button:last-child { border-right: 0; }
.switch button.on { background: var(--selected); color: var(--accent); font-weight: 600; }
.switch button[aria-disabled="true"] { color: var(--muted); }
.switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.pathlink { all: unset; cursor: pointer; font: 12px var(--mono); color: var(--accent); overflow-wrap: anywhere; }
.pathlink:hover { text-decoration: underline; }
.pathlink .d { color: var(--muted); }
.flinks { display: flex; flex-wrap: wrap; gap: 2px 14px; }

/* Changes screen: tree | divider | diff */
#scrChanges { display: grid; grid-template-columns: var(--tree-w) 6px minmax(0, 1fr); }
#scrChanges[hidden] { display: none; }
.tree { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--border); }
.tree .tb { display: grid; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--border); flex: none; }
.tree .tb .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; }
.tree .sum { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tree .sum b { color: var(--fg); }
.ffq { font: 13px var(--sans); height: 28px; padding: 0 8px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--bg); color: var(--fg); min-width: 0; width: 100%; }
.seg2 { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; }
.seg2 button { all: unset; cursor: pointer; padding: 0 8px; line-height: 24px; font-size: 12px; white-space: nowrap; }
.seg2 button.on { background: var(--fg); color: var(--bg); }
.seg2 button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tlist { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; flex: 1; min-height: 0; }
.trow { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 6px; width: 100%; padding: 1px 10px 1px calc(10px + var(--d, 0) * 16px); font: 12.5px/22px var(--mono); white-space: nowrap; }
.trow:hover { background: var(--panel-2); }

<script>
'use strict';
// Real-data snapshot of the software-factory workspace (read-only GETs, job files and git show), home path as ~, secrets redacted.
const SNAP = null; // Real-data snapshot omitted here (1.2 MB). The full prototype with data is on the branch prototype-dashboard-v3, docs/design/dashboard-v3/prototype-full.html.
const PLAN = null; // omitted, see prototype-full.html
const MRDATA = null; // omitted, see prototype-full.html
const VERSIONS_B64 = ''; // omitted, see prototype-full.html
// ---- helpers
const NOW = Date.parse(SNAP.taken_at);
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hm = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const day = (ts) => new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const dur = (ms) => { const m = Math.max(0, Math.round(ms / 60000)); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`; };
const money = (v) => (v == null ? '—' : '$' + v.toFixed(2));
const mtok = (n) => (n ? (n / 1e6).toFixed(2) + ' M' : '—');
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch { /* none */ } } };
const splitPath = (p) => { const i = p.lastIndexOf('/'); return i < 0 ? ['', p] : [p.slice(0, i), p.slice(i + 1)]; };

const WHO = { implementer: 'Implementer', claude: 'Claude review', codex: 'Codex gate', mr: 'MR writer', factory: 'Factory', you: 'You', proto: 'Prototype' };
const STATE_WORD = { starting: 'Starting', working: 'Implementing', awaiting_review: 'In review', preparing_mr: 'Writing the MR', needs_human: 'Waiting for you', ready_for_human_review: 'Ready for you', pushed: 'Pushed', aborted: 'Aborted', failed: 'Failed', parked: 'Waiting for limits' };
const REASON = { gate_rounds: 'Codex round limit reached', gate_budget: 'Codex token budget used up', gate_failed: 'Codex gate gave no verdict', iteration_limit: 'Fix round limit reached', review_churn: 'Fixes keep making findings', escalated: 'Question for you', review_disputed: 'A reviewer disputes a contest', review_failed: 'Claude review could not run', serve_restarted: 'Interrupted by a restart', mr_conflict: 'Rebase conflict' };
const RUNNING = ['starting', 'working', 'awaiting_review', 'preparing_mr', 'parked'];
const PLANMAP = Object.fromEntries(PLAN.map((p) => [p.ticket, p]));

// ---- Fix-section ids for the Codex findings (Fix n answers the gate of iteration n)
function fixItems(text) {
  const out = [];
  for (const m of (text || '').matchAll(/^\d+\. \[(R\d+), (\w+)\] `?([^`:\n]+)`?: ([\s\S]*?)(?=^\d+\. \[R|(?![\s\S]))/gm)) out.push({ id: m[1], severity: m[2], path: m[3], problem: m[4].trim() });
  return out;
}
function idsFor(src) {
  const map = {};
  for (const e of src.stream) if (e.t === 'prompt' && e.fix_n) map[e.fix_n] = fixItems(e.fix).map((x) => x.id);
  return map;
}

// ---- jobs: one in-memory job per ticket, rebuilt for a scenario
let scenario = 'wait';
const jobs = {};
let seq = 0;
function baseJob(t, src) {
  return { ticket: t, title: src.job.title, branch: src.job.branch, base: src.job.base || 'main', created_at: src.job.created_at, state: src.job.state, code: src.job.error?.code ?? null,
    iteration: src.job.iteration, stream: [], decisions: {}, paused: false, live: src.job.state === 'working', src, scenarioNote: null, mr: null };
}
function buildJob(t) {
  const src = SNAP.jobs[t];
  const ids = idsFor(src);
  const stream = src.stream.map((e, i) => ({ ...e, k: `${t}:${i}` }));
  for (const e of stream) if (e.t === 'verdict' && e.who === 'codex' && ids[e.it]) e.items = e.items.map((x, i) => ({ ...x, id: ids[e.it][i] }));
  const j = baseJob(t, src);
  j.stream = stream;
  if (scenario === 'wait' && t === 'SF-053') {
    const i = stream.findIndex((e) => e.t === 'state' && e.to === 'ready_for_human_review');
    j.stream = stream.slice(0, i + 1); j.state = 'ready_for_human_review'; j.iteration = 2;
    j.scenarioNote = `Shown as it really was at ${hm(stream[i].ts)}: ready for you, before you pushed it.`;
  }
  if (scenario === 'wait' && t === 'SF-054') {
    const i = stream.findIndex((e) => e.t === 'verdict' && e.who === 'codex' && e.it === 2);
    j.stream = stream.slice(0, i + 1); j.state = 'needs_human'; j.code = 'gate_rounds'; j.iteration = 2; j.resumeAt = i + 1;
    j.stream.push({ t: 'state', k: `${t}:stop`, ts: stream[i].ts, it: 2, from: 'awaiting_review', to: 'needs_human', code: 'gate_rounds', sim: true,
      msg: 'Simulated stop: this scenario sets the Codex round limit to 2. In reality the job went on to Fix 2.' });
    j.scenarioNote = 'Real data up to the Codex verdict of iteration 2; the stop after it is simulated.';
  }
  if (scenario === 'wait' && t === 'SF-040') {
    const i = stream.findIndex((e) => e.t === 'state' && e.to === 'needs_human');
    j.stream = stream.slice(0, i + 1); j.state = 'needs_human'; j.code = stream[i].code; j.iteration = 1; j.stopIt = stream[i].it; j.resumeAt = i + 1;
    j.scenarioNote = `Shown as it really was at ${hm(stream[i].ts)}: stopped because sf serve restarted. 53 files by the end.`;
  }
  if (scenario === 'limit' && t === 'SF-055') {
    j.state = 'parked'; j.live = true;
    j.stream.push({ t: 'state', k: `${t}:park`, ts: new Date(NOW).toISOString(), it: j.iteration + 1, from: 'working', to: 'parked', sim: true, msg: 'Usage limit reached: the job is parked and resumes when the limit resets at 03:00.' });
    j.scenarioNote = 'Simulated: the Claude usage limit was hit during this run.';
  }
  return j;
}
// A job the queue started inside the prototype.
function simJob(t) {

  if (ev.target.name === 'rule') { Q.rule = ev.target.value; toast('Simulated: rule saved'); renderBoard(); return renderState(); }
  if (ev.target.id === 'tkFile') addImages(ev.target.files);
  if (ev.target.id === 'scenario') { scenario = ev.target.value; boot(); toast({ wait: 'Scenario: SF-053 ready (real moment), SF-040 stopped by a restart (real), SF-054 stopped by the round limit (simulated)', snap: 'Scenario: every job as it was when the snapshot was taken', limit: 'Scenario: the usage limit was hit; SF-055 is parked and the queue is held' }[scenario]); }
});
document.addEventListener('paste', (ev) => { if (ui.screen === 'ticket' && ev.clipboardData?.files?.length) { ev.preventDefault(); addImages(ev.clipboardData.files); } });
document.addEventListener('dragover', (ev) => { const d = ev.target.closest?.('#tkDrop'); if (d) { ev.preventDefault(); d.classList.add('over'); } });
document.addEventListener('drop', (ev) => { const d = ev.target.closest?.('#tkDrop'); if (d) { ev.preventDefault(); addImages(ev.dataTransfer.files); } });
document.addEventListener('keydown', (ev) => {
  const typing = ev.target.closest('textarea, input, select');
  if ((ev.ctrlKey || ev.metaKey) && ev.key === 's' && ui.screen === 'mr') { ev.preventDefault(); return mrAction('save'); }
  if (typing) {
    if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey) && ev.target.id === 'msg') { ev.preventDefault(); act('send'); }
    if (ev.key === 'Escape') ev.target.blur();
    if (ev.target.id === 'cxq' && (ev.key === 'ArrowDown' || ev.key === 'Enter')) { ev.preventDefault(); document.querySelector('#tlist .trow.sel')?.focus(); }
    return;
  }
  if (ev.altKey && ui.screen === 'board' && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown')) { const c = document.activeElement?.closest?.('.card[data-q]'); if (c) { ev.preventDefault(); moveQueued(c.dataset.ticket, Q.order.indexOf(c.dataset.ticket) + (ev.key === 'ArrowUp' ? -1 : 1)); } return; }
  if (ev.key === 'F7') { if (ui.screen === 'changes') { ev.preventDefault(); fileStep(ev.shiftKey ? -1 : 1); } return; }
  if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
  if (ui.screen === 'board') {
    const cards = [...document.querySelectorAll('#cols .card')];
    const i = cards.indexOf(document.activeElement);
    if (ev.key === 'j' || ev.key === 'k') { ev.preventDefault(); cards[Math.min(cards.length - 1, Math.max(0, i + (ev.key === 'j' ? 1 : -1)))]?.focus(); }
    if (ev.key === 'Enter' && document.activeElement?.classList.contains('card')) { const a = document.activeElement; if (a.dataset.open) go(a.dataset.open, 'stream'); else if (a.dataset.ticket) openTicket(a.dataset.ticket); }
    return;
  }
  if (ev.key === 'Escape') {
    ev.preventDefault();
    if (!$('#rulesMenu').hidden) { $('#rulesMenu').hidden = true; return; }
    if (ui.screen === 'stream' && ui.confirm) { ui.confirm = null; renderComposer(); return renderState(); }
    if (ui.screen === 'changes' || ui.screen === 'mr') return go(ui.job, 'stream');
    return back();
  }
  if (ui.screen === 'ticket') return;
  if (ev.key === 'c' && ui.screen !== 'changes') { ev.preventDefault(); return openChanges(ui.cx.sel, null); }
  if (ev.key === 'm' && ui.screen !== 'mr') { ev.preventDefault(); return go(ui.job, 'mr'); }
  if (ev.key === 's' && ui.screen !== 'stream') { ev.preventDefault(); return go(ui.job, 'stream'); }
  if (ui.screen === 'changes') {
    if (ev.key === '/') { ev.preventDefault(); return $('#cxq')?.focus(); }
    if (ev.key === 'n' || ev.key === 'p') { ev.preventDefault(); return fileStep(ev.key === 'n' ? 1 : -1); }
    if (ev.target.closest('#dbody') && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown')) return;
    if (treeKey(ev)) return;
    return;
  }
  if (ui.screen !== 'stream') return;
  const es = entries();
  if (ev.key === 'j' || ev.key === 'k') { ev.preventDefault(); ui.sel = ui.sel < 0 ? (ev.key === 'j' ? 0 : es.length - 1) : Math.min(es.length - 1, Math.max(0, ui.sel + (ev.key === 'j' ? 1 : -1))); markSel(true); return renderState(); }
  if (ev.key === 'G') { ui.sel = es.length - 1; markSel(true); return; }
  if (ev.key === 'Enter' && ui.sel >= 0 && document.activeElement?.tagName !== 'BUTTON') { const li = es[ui.sel]; if (li?.querySelector('[data-toggle]')) { ev.preventDefault(); const keep = ui.sel; toggle(li.dataset.k); ui.sel = keep; markSel(true); } }
});
// resizable file tree
(() => {
  document.addEventListener('pointerdown', (ev) => {
    const d = ev.target.closest?.('#vdiv'); if (!d) return;
    d.setPointerCapture(ev.pointerId); d.classList.add('drag');
    const move = (e) => { const r = $('#scrChanges').getBoundingClientRect(); document.documentElement.style.setProperty('--tree-w', Math.max(200, Math.min(r.width - 360, e.clientX - r.left)) + 'px'); };
    const up = () => { d.classList.remove('drag'); d.removeEventListener('pointermove', move); d.removeEventListener('pointerup', up); };
    d.addEventListener('pointermove', move); d.addEventListener('pointerup', up);
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.target.id !== 'vdiv' || (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight')) return;
    ev.preventDefault(); ev.stopImmediatePropagation();
    const w = $('.tree').getBoundingClientRect().width; document.documentElement.style.setProperty('--tree-w', Math.max(200, w + (ev.key === 'ArrowLeft' ? -32 : 32)) + 'px');
  }, true);
})();
function route() {
  const m = location.hash.slice(1).match(/^(SF-\d+)(?:-(changes|mr|ticket))?$/);
  if (!m) { if (ui.screen !== 'board') back(); return; }
  if (m[2] === 'ticket' && PLANMAP[m[1]]) { if (ui.screen !== 'ticket' || ui.ticket !== m[1]) openTicket(m[1]); return; }
  if (jobs[m[1]]) { const s = m[2] || 'stream'; if (ui.job !== m[1] || ui.screen !== s) { if (s === 'changes') { ui.job = m[1]; openChanges(null, null); } else go(m[1], s); } }
}
window.addEventListener('hashchange', route);

// ---- boot
function boot() {
  for (const k of Object.keys(jobs)) delete jobs[k];
  for (const t of Object.keys(SNAP.jobs)) jobs[t] = buildJob(t);
  for (const k of Object.keys(TK)) delete TK[k];
  initQueue();
  const mode = store.get('sf-proto-mode'); if (mode === 'side' || mode === 'uni') ui.cx.mode = mode;
  if (ui.screen === 'ticket' && ui.ticket) openTicket(ui.ticket);
  else if (ui.job && jobs[ui.job] && ui.screen !== 'board') go(ui.job, ui.screen === 'mr' && !mrAvailable(jobs[ui.job]) ? 'stream' : ui.screen);
  else { ui.screen = 'board'; ui.job = null; renderBoard(); renderState(); }
  renderBoard();
}
boot();
route();
loadVersions();
</script>
