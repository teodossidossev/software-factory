<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Software Factory</title>
  <link rel="stylesheet" href="ux.css">
  <script src="ux.js" defer></script>
</head>
<body>
  <div id="app">
    <aside id="rail" aria-label="Navigation"></aside>
    <div id="shell">
      <header id="hdr"></header>
      <main id="main"></main>
    </div>
  </div>
  <div id="scrim" hidden></div>
  <aside id="drawer" aria-label="Details" hidden></aside>
  <footer id="status" aria-label="Factory status"></footer>
  <dialog id="nt" aria-labelledby="nt-title"></dialog>
  <div id="toast" role="status" hidden></div>
  <div id="proto"></div>
  <noscript>This prototype needs JavaScript.</noscript>
</body>
</html>
